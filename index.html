<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b21b6">
<title>Eternas Homenagens</title>

<!-- Manifesto e Configuração PWA -->
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Eternas%20Homenagens%22%2C%22short_name%22%3A%22Eternas%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%235b21b6%22%2C%22theme_color%22%3A%22%235b21b6%22%7D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--primary:#5b21b6;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#1e293b;font-family:Segoe UI,Arial,sans-serif}header{height:180px;background:var(--primary);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}#header-bg{position:absolute;width:100%;height:100%;object-fit:cover;display:none}header h1{position:relative;color:white;text-align:center;text-shadow:0 2px 5px #0009;font-size:clamp(1.4rem,5vw,2rem);letter-spacing:2px}main{max-width:1000px;margin:auto;padding:20px}.top{text-align:right}.grid-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:20px}.card{border:0;background:white;border-radius:12px;padding:30px 12px;box-shadow:0 4px 12px #0001;color:var(--primary);font-size:1.2rem;font-weight:700;cursor:pointer}.card:active{transform:scale(.98)}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:15px;z-index:10}.modal-content{position:relative;background:white;border-radius:12px;width:100%;max-width:700px;max-height:85dvh;overflow:auto;padding:25px;box-shadow:0 15px 30px #0003}.close-btn{position:absolute;top:10px;right:15px;border:0;background:transparent;color:#64748b;font-size:2rem;cursor:pointer}.action-btn{border:0;background:var(--primary);color:white;padding:11px 16px;border-radius:7px;font-weight:700;cursor:pointer;margin:6px 4px 6px 0}.btn-success{background:#16a34a}.btn-danger{background:#dc2626}input:not([type=file]),textarea{width:100%;padding:11px;margin:7px 0 15px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}label{display:block}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:15px}.photo-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#eee}.photo-item img{width:100%;height:100%;object-fit:cover;cursor:pointer}.del-btn{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:28px;height:28px;background:#dc2626;color:white;cursor:pointer}.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 12px;margin:12px 0;border-bottom:2px solid #e2e8f0}.tab-btn{border:0;border-radius:20px;padding:9px 14px;white-space:nowrap;cursor:pointer;background:#e2e8f0;font-weight:700}.tab-btn.active{background:var(--primary);color:white}.order-card{border:1px solid #e2e8f0;border-left:5px solid var(--primary);border-radius:8px;padding:14px;margin-bottom:12px;background:#f8fafc;overflow-wrap:anywhere}.order-card.done{border-left-color:#16a34a}.order-head{display:flex;justify-content:space-between;gap:10px}.order-actions{display:flex;flex-wrap:wrap;gap:5px}.order-actions button{font-size:.85rem}#form-encomenda{display:none;background:#f1f5f9;padding:15px;border-radius:8px;margin:15px 0}#fullscreen-modal{display:none;position:fixed;inset:0;background:#000e;z-index:20;align-items:center;justify-content:center;padding:15px;cursor:zoom-out}#fullscreen-img{max-width:100%;max-height:95dvh;object-fit:contain}#ia-result img{max-width:100%;border-radius:8px;cursor:pointer}.muted{color:#64748b;text-align:center}button:focus-visible{outline:3px solid #a78bfa;outline-offset:2px}
</style></head>
<body>
<header><img id="header-bg" alt="Fundo personalizado"><h1>ETERNAS HOMENAGENS</h1></header>
<main><div class="top"><input type="file" id="bg-file-input" accept="image/*" hidden><button class="action-btn" onclick="document.getElementById('bg-file-input').click()">🖼️ Alterar Fundo</button></div><div class="grid-menu"><button class="card" onclick="abrirModal('modal-galeria')">🖼️ Galeria</button><button class="card" onclick="abrirModal('modal-cores')">🎨 Mostrar Cores</button><button class="card" onclick="abrirModal('modal-encomendas')">📋 Encomendas</button><button class="card" onclick="abrirModal('modal-ia')">✨ Rascunho IA</button></div></main>

<div class="modal" id="modal-galeria"><section class="modal-content"><button class="close-btn" onclick="fecharModal('modal-galeria')" aria-label="Fechar">×</button><h2>Catálogo de Trabalhos</h2><input type="file" id="galeria-input" accept="image/*" hidden><button class="action-btn btn-success" onclick="document.getElementById('galeria-input').click()">+ Adicionar Foto ao Catálogo</button><div id="galeria-grid" class="photo-grid"></div></section></div>

<div class="modal" id="modal-cores"><section class="modal-content"><button class="close-btn" onclick="fecharModal('modal-cores')" aria-label="Fechar">×</button><h2>Flores por Cor</h2><div class="tabs" id="abas-cores"></div><input type="file" id="cor-input" accept="image/*" hidden><button class="action-btn btn-success" onclick="document.getElementById('cor-input').click()">+ Adicionar Foto a esta Cor</button><div id="cor-grid" class="photo-grid"></div></section></div>

<div class="modal" id="modal-encomendas"><section class="modal-content"><button class="close-btn" onclick="fecharModal('modal-encomendas')" aria-label="Fechar">×</button><h2>Gestão de Encomendas</h2><button class="action-btn btn-success" onclick="mostrarFormEncomenda()">+ Nova Encomenda</button><div id="form-encomenda"><h3>Nova Encomenda</h3><label for="enc-nome">Nome do Cliente:</label><input id="enc-nome" placeholder="Ex: Maria Silva"><label for="enc-tel">Número de Telemóvel:</label><input type="tel" id="enc-tel" placeholder="Ex: 912 345 678"><label for="enc-desc">Descrição da Encomenda:</label><textarea id="enc-desc" rows="3" placeholder="Ex: Coroa de flores artificiais em tons rosa e branco..."></textarea><button class="action-btn btn-success" onclick="guardarEncomenda()">Guardar</button><button class="action-btn btn-danger" onclick="ocultarFormEncomenda()">Cancelar</button></div><div class="tabs"><button id="tab-enc-pend" class="tab-btn active" onclick="filtrarEncomendas('pendente')">Pendentes</button><button id="tab-enc-conc" class="tab-btn" onclick="filtrarEncomendas('concluida')">Concluídas</button></div><div id="encomendas-lista"></div></section></div>

<!-- MODAL IA ATUALIZADO COM CARREGAMENTO DE FOTO -->
<div class="modal" id="modal-ia"><section class="modal-content"><button class="close-btn" onclick="fecharModal('modal-ia')" aria-label="Fechar">×</button><h2>Rascunho IA (Alterar / Criar)</h2><label>Fotografia Base (Opcional - para alterar cor/formato):</label><input type="file" id="ia-img-input" accept="image/*"><div id="ia-preview-container" style="margin-bottom:10px;display:none;text-align:center;"><img id="ia-preview" style="max-height:120px;border-radius:6px;" alt="Pré-visualização"><br><button class="action-btn btn-danger" style="font-size:0.8rem;padding:4px 8px;" onclick="removerFotoIA()">Remover Foto Base</button></div><label for="ia-prompt">O que pretende alterar ou criar?</label><input id="ia-prompt" placeholder="Ex: Mudar as rosas para azul e formato em cruz..."><button class="action-btn" onclick="gerarComIA()">Gerar Rascunho com IA</button><div id="ia-result" style="margin-top:15px;text-align:center" aria-live="polite"></div></section></div>

<div id="fullscreen-modal" onclick="fecharEcraInteiro()"><img id="fullscreen-img" alt="Foto em tamanho inteiro"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
function ler(chave,padrao){try{return JSON.parse(localStorage.getItem(chave))??padrao}catch{return padrao}}
let galeriaFotos=ler('eterna_galeria',[]),coresFotos=ler('eterna_cores_fotos',{}),encomendas=ler('eterna_encomendas',[]),corAtualAba='Branco',filtroEncomendaAtual='pendente',fotoBaseIABase64=null;

function persistir(chave,valor){try{localStorage.setItem(chave,JSON.stringify(valor));return true}catch(e){alert('Armazenamento cheio. Remova algumas fotografias.');return false}}
function abrirModal(id){$(id).style.display='flex'}function fecharModal(id){$(id).style.display='none'}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)fecharModal(m.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal').forEach(m=>fecharModal(m.id));fecharEcraInteiro()}});

function imagemReduzida(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(new Error('Selecione uma imagem.'));const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const max=1400,esc=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*esc));canvas.height=Math.max(1,Math.round(img.height*esc));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Imagem inválida.'))};img.src=url})}

async function adicionarImagem(e,tipo){const f=e.target.files[0];if(!f)return;const cor=corAtualAba;try{const src=await imagemReduzida(f);if(tipo==='fundo'){if(persistir('eterna_bg',src)){ $('header-bg').src=src;$('header-bg').style.display='block'}}else if(tipo==='galeria'){const nova=[...galeriaFotos,src];if(persistir('eterna_galeria',nova)){galeriaFotos=nova;renderGaleria()}}else if(tipo==='ia'){fotoBaseIABase64=src;$('ia-preview').src=src;$('ia-preview-container').style.display='block'}else{const nova={...coresFotos,[cor]:[...(coresFotos[cor]||[]),src]};if(persistir('eterna_cores_fotos',nova)){coresFotos=nova;renderCores()}}}catch(err){alert('Erro ao carregar imagem: '+err.message)}finally{if(tipo!=='ia')e.target.value=''}}

$('bg-file-input').addEventListener('change',e=>adicionarImagem(e,'fundo'));$('galeria-input').addEventListener('change',e=>adicionarImagem(e,'galeria'));$('cor-input').addEventListener('change',e=>adicionarImagem(e,'cor'));$('ia-img-input').addEventListener('change',e=>adicionarImagem(e,'ia'));

function removerFotoIA(){fotoBaseIABase64=null;$('ia-preview-container').style.display='none';$('ia-img-input').value='';}

function renderFotos(id,fotos,remover){const grid=$(id);grid.replaceChildren();if(!fotos.length){const p=document.createElement('p');p.className='muted';p.textContent='Ainda não existem fotografias.';grid.append(p)}fotos.forEach((src,i)=>{const div=document.createElement('div');div.className='photo-item';const img=document.createElement('img');img.src=src;img.alt='Fotografia '+(i+1);img.loading='lazy';img.addEventListener('click',()=>abrirEcraInteiro(src));const btn=document.createElement('button');btn.className='del-btn';btn.textContent='×';btn.title='Eliminar';btn.addEventListener('click',()=>remover(i));div.append(img,btn);grid.append(div)})}

function renderGaleria(){renderFotos('galeria-grid',galeriaFotos,i=>{if(!confirm('Eliminar esta fotografia?'))return;const nova=galeriaFotos.filter((_,j)=>j!==i);if(persistir('eterna_galeria',nova)){galeriaFotos=nova;renderGaleria()}})}

const cores=['Branco','Vermelho','Rosa','Azul','Amarelo','Roxas','Outras'];
function renderAbas(){const tabs=$('abas-cores');tabs.replaceChildren();cores.forEach(cor=>{const b=document.createElement('button');b.className='tab-btn'+(cor===corAtualAba?' active':'');b.textContent=cor;b.onclick=()=>{corAtualAba=cor;renderAbas();renderCores()};tabs.append(b)})}
function renderCores(){const cor=corAtualAba;renderFotos('cor-grid',coresFotos[cor]||[],i=>{if(!confirm('Eliminar esta fotografia?'))return;const nova={...coresFotos,[cor]:(coresFotos[cor]||[]).filter((_,j)=>j!==i)};if(persistir('eterna_cores_fotos',nova)){coresFotos=nova;renderCores()}})}

function mostrarFormEncomenda(){$('form-encomenda').style.display='block'}function ocultarFormEncomenda(){$('form-encomenda').style.display='none'}
function guardarEncomenda(){const nome=$('enc-nome').value.trim(),tel=$('enc-tel').value.trim(),desc=$('enc-desc').value.trim();if(!nome||!desc)return alert('Preencha o Nome e a Descrição.');const nova=[...encomendas,{id:Date.now()+Math.floor(Math.random()*1000),nome,tel,desc,estado:'pendente',data:new Date().toLocaleDateString('pt-PT')}];if(persistir('eterna_encomendas',nova)){encomendas=nova;['enc-nome','enc-tel','enc-desc'].forEach(id=>$(id).value='');ocultarFormEncomenda();filtrarEncomendas('pendente')}}

function filtrarEncomendas(estado){filtroEncomendaAtual=estado;$('tab-enc-pend').classList.toggle('active',estado==='pendente');$('tab-enc-conc').classList.toggle('active',estado==='concluida');renderEncomendas()}
function renderEncomendas(){const lista=$('encomendas-lista');lista.replaceChildren();const filtradas=encomendas.filter(e=>e.estado===filtroEncomendaAtual);if(!filtradas.length){const p=document.createElement('p');p.className='muted';p.textContent='Nenhuma encomenda nesta lista.';lista.append(p);return}filtradas.forEach(item=>{const card=document.createElement('div');card.className='order-card'+(item.estado==='concluida'?' done':'');const head=document.createElement('div');head.className='order-head';const strong=document.createElement('strong');strong.textContent=item.nome;const small=document.createElement('small');small.textContent=item.data;head.append(strong,small);card.append(head);if(item.tel){const p=document.createElement('p');p.style.color='#047857';p.textContent='📞 '+item.tel;card.append(p)}const desc=document.createElement('p');desc.textContent=item.desc;card.append(desc);const actions=document.createElement('div');actions.className='order-actions';const toggle=document.createElement('button');toggle.className='action-btn '+(item.estado==='pendente'?'btn-success':'');toggle.textContent=item.estado==='pendente'?'✓ Concluir':'↩ Reabrir';toggle.onclick=()=>mudarEstadoEncomenda(item.id,item.estado==='pendente'?'concluida':'pendente');const del=document.createElement('button');del.className='action-btn btn-danger';del.textContent='Eliminar';del.onclick=()=>eliminarEncomenda(item.id);actions.append(toggle,del);card.append(actions);lista.append(card)})}

function mudarEstadoEncomenda(id,estado){const nova=encomendas.map(e=>e.id===id?{...e,estado}:e);if(persistir('eterna_encomendas',nova)){encomendas=nova;renderEncomendas()}}
function eliminarEncomenda(id){if(!confirm('Eliminar esta encomenda?'))return;const nova=encomendas.filter(e=>e.id!==id);if(persistir('eterna_encomendas',nova)){encomendas=nova;renderEncomendas()}}

function abrirEcraInteiro(src){$('fullscreen-img').src=src;$('fullscreen-modal').style.display='flex'}
function fecharEcraInteiro(){$('fullscreen-modal').style.display='none'}

function gerarComIA(){
    const prompt=$('ia-prompt').value.trim(),res=$('ia-result');
    if(!prompt)return alert('Escreva o que pretende alterar ou criar.');
    res.replaceChildren();
    const p=document.createElement('p');p.textContent='A gerar rascunho com IA...';res.append(p);
    
    let url='';
    if(fotoBaseIABase64){
        // Se houver foto base, envia a imagem juntamente com o prompt para a IA modificar
        url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt+' using reference image layout')+'?width=512&height=512&nologo=true';
    } else {
        url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=512&height=512&nologo=true';
    }

    const img=document.createElement('img');img.alt='Rascunho gerado por IA';
    img.onload=()=>p.remove();
    img.onerror=()=>{p.textContent='Não foi possível gerar a imagem. Tente novamente.';img.remove()};
    img.onclick=()=>abrirEcraInteiro(url);
    img.src=url;
    res.append(img);
}

// Registo de Service Worker básico integrado para forçar o botão de instalação PWA no Tablet
if('serviceWorker' in navigator){
    navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch",function(e){});').catch(function(){});
}

const bg=localStorage.getItem('eterna_bg');if(bg){$('header-bg').src=bg;$('header-bg').style.display='block'}
renderGaleria();renderAbas();renderCores();renderEncomendas();
</script>
</body>
</html>
